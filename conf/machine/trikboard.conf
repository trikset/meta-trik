#@TYPE: Machine
#@NAME: Trikboard
#@DESCRIPTION: Machine configuration for the RK3568 trikboard

DEFAULTTUNE ?= "cortexa55"

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

IMAGE_CLASSES += "trik-sd-image"

PREFERRED_PROVIDER_virtual/kernel = "linux-trik"
PREFERRED_PROVIDER_virtual/bootloader = "barebox"

# TODO: Use the configuration for the devboard until a test instance is available
# TODO: replace the non-dev values with the production carrier configuration.
TRIKBOARD_VARIANT ?= "dev"

BAREBOX_CONFIG = "${@bb.utils.contains('TRIKBOARD_VARIANT', 'dev', 'diasom_rk35xx_defconfig', 'trikboard_defconfig', d)}"
KERNEL_IMAGETYPE = "Image.gz"
KERNEL_DEVICETREE = "${@bb.utils.contains('TRIKBOARD_VARIANT', 'dev', 'rockchip/rk3568-diasom-som-evb.dtb', 'rockchip/rk3568-trikboard.dtb', d)}"

# TODO: Later, transfer to the appropriate debug CPU port.
SERIAL_CONSOLES = "1500000;ttyS2"

MACHINE_FEATURES = "alsa bluetooth ext2 mmc rtc screen serial touchscreen usbhost vfat wifi"

MACHINE_EXTRA_RRECOMMENDS += " \
	kernel-modules \
	modprobe-blacklist \
"
