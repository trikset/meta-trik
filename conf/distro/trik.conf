#@TYPE: Distribution
#@NAME: trik
#@DESCRIPTION: TRIK distribution for RK3568 trikboard

INIT_MANAGER = "systemd"
DISTRO_FEATURES = "acl alsa bluetooth ext2 ipv4 ipv6 kms opengl pam pci seccomp smbfs usbgadget usbhost vfat wifi x11 xattr zeroconf"

# TODO(eMMC): persistent logging writes continuously to flash and consumes its
# endurance. This is an interim configuration; a logging/storage strategy that
# keeps diagnostics available without excessive eMMC wear still needs to be
# designed.
# Keep /var/log on persistent storage so the (size-limited) journal survives reboots.
VOLATILE_LOG_DIR = "no"
